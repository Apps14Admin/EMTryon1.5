<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF500" />
      <stop offset="100%" stop-color="#FFCC00" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0080FF" />
    </linearGradient>
    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0055" />
      <stop offset="100%" stop-color="#CC0088" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E1065" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    
    <pattern id="halftoneDots" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="2" cy="2" r="1.5" fill="#111111" opacity="0.3" />
      <circle cx="6" cy="6" r="1" fill="#FFD700" opacity="0.4" />
    </pattern>

    <pattern id="sportsRingPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#00F0FF" />
      <rect x="20" width="20" height="20" fill="#FF0055" />
      <rect y="20" width="20" height="20" fill="#FFD700" />
      <rect x="20" y="20" width="20" height="20" fill="#2E1065" />
      <circle cx="10" cy="10" r="3" fill="#1E1B4B" />
      <circle cx="30" cy="10" r="3" fill="#FFD700" />
      <circle cx="10" cy="30" r="3" fill="#FF0055" />
      <circle cx="30" cy="30" r="3" fill="#00F0FF" />
    </pattern>
    
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Shadowed Circle -->
  <circle cx="100" cy="100" r="95" fill="#ffffff" filter="url(#badgeShadow)" />

  <!-- Multi-Colored Sports Pattern Ring -->
  <circle cx="100" cy="100" r="95" fill="url(#sportsRingPattern)" />
  
  <!-- Halftone Overlay on Outer Ring -->
  <circle cx="100" cy="100" r="95" fill="url(#halftoneDots)" />

  <!-- Dynamic CMYK Segment Highlights on Ring -->
  <path d="M 100 5 A 95 95 0 0 1 190 70 L 173 76 A 77 77 0 0 0 100 23 Z" fill="#FF0055" />
  <path d="M 190 70 A 95 95 0 0 1 170 165 L 155 152 A 77 77 0 0 0 173 76 Z" fill="#FFD700" />
  <path d="M 170 165 A 95 95 0 0 1 70 190 L 76 173 A 77 77 0 0 0 155 152 Z" fill="#00F0FF" />
  <path d="M 70 190 A 95 95 0 0 1 10 120 L 27 115 A 77 77 0 0 0 76 173 Z" fill="#2E1065" />
  <path d="M 10 120 A 95 95 0 0 1 25 30 L 40 43 A 77 77 0 0 0 27 115 Z" fill="#FFD700" />
  <path d="M 25 30 A 95 95 0 0 1 100 5 L 100 23 A 77 77 0 0 0 40 43 Z" fill="#00F0FF" />

  <!-- Inner Crisp White Badge Background -->
  <circle cx="100" cy="100" r="80" fill="#FFFFFF" stroke="#111111" stroke-width="1.5" />

  <!-- CENTER LOGO EMBLEM: Stylized Geometric "EM" -->
  <g transform="translate(42, 48) scale(0.85)">
    <!-- Letter E (Three slanted horizontal bars) -->
    <path d="M 15 0 L 52 0 L 45 14 L 8 14 Z" fill="#1E1B4B" />
    <path d="M 8 20 L 42 20 L 35 34 L 1 34 Z" fill="#00F0FF" />
    <path d="M 1 40 L 48 40 L 41 54 L -6 54 Z" fill="url(#yellowGrad)" />
    <!-- Stipple texture on bottom E bar -->
    <circle cx="12" cy="47" r="1.5" fill="#2E1065" />
    <circle cx="20" cy="47" r="1.5" fill="#FF0055" />
    <circle cx="28" cy="47" r="1.5" fill="#00F0FF" />
    
    <!-- Letter M (Two overlapping slanted chevrons/peaks) -->
    <path d="M 45 54 L 62 10 L 78 54 L 66 54 L 62 38 L 57 54 Z" fill="#2E1065" />
    <path d="M 72 54 L 89 10 L 105 54 L 93 54 L 89 38 L 84 54 Z" fill="#FF0055" />
  </g>

  <!-- BOTTOM TEXT: "SPORTS" -->
  <text x="100" y="142" 
        font-family="'Oswald', 'Impact', 'Arial Black', sans-serif" 
        font-size="24" 
        font-weight="900" 
        letter-spacing="3" 
        text-anchor="middle" 
        fill="#000000">
    SPORTS
  </text>
</svg>
