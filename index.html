    /* ══════════════════════════════════════════════════════════════════════
       EM SPORT DARK THEME — role tokens, then one mapping of the utilities
       this app already uses onto those roles. Set data-theme="dark" on <html>.

       Specificity does the work (0,2,0 beats 0,1,0), so no !important. Light
       mode is untouched: every rule below is scoped to the dark attribute.
       ══════════════════════════════════════════════════════════════════════ */
    html[data-theme="dark"] {
      color-scheme: dark;
      --em-page: #101110;      --em-input: #151716;    --em-card: #1B1D1B;
      --em-raised: #232624;  --em-overlay: #0A0B0A;
      --em-border-subtle: #272A27; --em-border: #333733; --em-border-strong: #434841;
      --em-ink: #ECEEE9;   --em-ink-2: #ABAFA6;
      --em-ink-3: #7E837A;   --em-ink-4: #5C6058;
      --em-accent: #E3C247;  --em-accent-strong: #F0D264;
      --em-accent-dim: #A98F2C; --em-accent-ink: #15150E;
    }

    html[data-theme="dark"] body { background-color: var(--em-page); color: var(--em-ink-2); }

    /* Chrome the utilities cannot reach. */
    html[data-theme="dark"] ::-webkit-scrollbar-track { background: var(--em-input); }
    html[data-theme="dark"] ::-webkit-scrollbar-thumb { background: var(--em-border-strong); border-radius: 4px; }
    html[data-theme="dark"] ::-webkit-scrollbar-thumb:hover { background: var(--em-ink-4); }
    html[data-theme="dark"] .bg-grid-pattern {
      background-image:
        linear-gradient(to right, rgba(236,238,233,.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(236,238,233,.035) 1px, transparent 1px);
    }

    /* Form controls are browser-painted; they need saying outright. Inputs sit
       on --em-input so they read as wells sunk below the card around them. */
    html[data-theme="dark"] input, html[data-theme="dark"] textarea, html[data-theme="dark"] select {
      background-color: var(--em-input); color: var(--em-ink); border-color: var(--em-border);
    }
    html[data-theme="dark"] input:focus, html[data-theme="dark"] textarea:focus,
    html[data-theme="dark"] select:focus { border-color: var(--em-accent-dim); }
    html[data-theme="dark"] ::placeholder { color: var(--em-ink-4); }
    html[data-theme="dark"] option { background-color: var(--em-card); color: var(--em-ink); }
    html[data-theme="dark"] :disabled { color: var(--em-ink-4); }
    html[data-theme="dark"] ::selection { background: rgba(227,194,71,.28); color: var(--em-ink); }
    html[data-theme="dark"] :focus-visible { outline-color: var(--em-accent); }

    /* On a dark ground a light shadow reads as haze. Deepen instead. */
    html[data-theme="dark"] .shadow-2xs, html[data-theme="dark"] .shadow-xs,
    html[data-theme="dark"] .shadow-sm, html[data-theme="dark"] .shadow,
    html[data-theme="dark"] .shadow-lg, html[data-theme="dark"] .shadow-xl,
    html[data-theme="dark"] .shadow-2xl { --tw-shadow-color: rgba(0,0,0,.55); }

    /* Photographs and renders are content, not chrome: never re-tint them.
       A hair of brightness comes off so they sit on the dark ground. */
    html[data-theme="dark"] img:not([src^="data:image/svg"]) { filter: brightness(.96); }

       ══════════════════════════════════════════════════════════════════════ */
